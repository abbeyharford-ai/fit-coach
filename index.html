<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <!-- The page may only load code from itself + jsDelivr, and only talk to GitHub and Claude. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com https://api.anthropic.com https://cdn.jsdelivr.net; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Summer Coach</title>
  <meta name="theme-color" content="#fff0f5">
  <!-- Installable app: home-screen icon, full screen, its own persistent storage -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/s-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Coach">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Mono:wght@400&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="icon" type="image/png" href="icons/s-icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.js" integrity="sha384-MH1axGwz/uQzfIcjFdjEfsM0xlf5mmWfAwwggaOh5IPFvgKFGbJ2PZ4VBbgSYBQN" crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#today">Summer Coach</a>
    <div class="row">
      <span id="sync-status" class="muted small"></span>
      <button id="lock-btn" class="ghost small" hidden aria-label="Lock the app">🔒 Lock</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <a href="#today" data-tab="today">Today</a>
    <a href="#train" data-tab="train">Train</a>
    <a href="#prs" data-tab="prs">PRs</a>
    <a href="#body" data-tab="body">Body</a>
    <a href="#meals" data-tab="meals">Meals</a>
    <a href="#coach" data-tab="coach">Coach</a>
    <a href="#profile" data-tab="profile">Profile</a>
    <a href="#settings" data-tab="settings" aria-label="Settings">⚙︎</a>
  </nav>

  <main id="view" class="container"></main>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
